[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hy3-process-verifier"
version = "0.1.0"
description = "Hy3 code-task app with process-level evaluation and error localization"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40",
  "streamlit>=1.37",
  "pandas>=2.0",
  "python-dotenv>=1.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

