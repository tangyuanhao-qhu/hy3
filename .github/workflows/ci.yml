name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Task bank gate (schema + sandbox execution of every reference solution)
        run: PYTHONPATH=src python scripts/verify_tasks.py

      - name: Gold set gate (labels must agree with execution)
        run: PYTHONPATH=src python scripts/verify_gold.py

      - name: Self-check (zero-extra-dependency smoke test)
        run: PYTHONPATH=src python scripts/self_check.py

      - name: Validation pipeline
        run: PYTHONPATH=src python scripts/run_validation.py

      - name: Pytest
        run: PYTHONPATH=src python -m pytest -q
